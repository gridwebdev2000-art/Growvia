[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — React Router handles client-side routing
# API routes and SEO endpoints are handled by Netlify Functions
# via config.path exports in each function file
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
